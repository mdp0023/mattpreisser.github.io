name: Generate Publications from BibTeX

on:
  push:
    branches: [ main ]
    paths:
      - 'publications.bib'
      - 'scripts/process_bib.py'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Generate HTML from BibTeX
      id: generate
      run: |
        cd ${{ github.workspace }}
        python scripts/process_bib.py > publications_temp.html
        cat publications_temp.html
    
    - name: Update about_me.html
      run: |
        cd ${{ github.workspace }}
        python << 'EOF'
        import re
        from pathlib import Path
        
        # Read generated HTML
        with open('publications_temp.html', 'r') as f:
            new_content = f.read()
        
        # Read about_me.html
        with open('about_me.html', 'r') as f:
            html_content = f.read()
        
        # Replace publications section
        # Find the Publications h2 and replace content until the next hr.major
        pattern = r'(<!-- PUBLICATIONS -->.*?<h2>Publications</h2>).*?(<!-- SOFTWARE PACKAGES -->)'
        
        replacement = r'\1\n\n' + new_content + '\n\n\t\t\t\t\t\t\n\n\t\t\t\t\t\t\n\n\t\t\t\t\t\t\n\n\t\t\t\t\t\t\n\n\t\t\t\t\t\t\r\2'
        
        updated_html = re.sub(pattern, replacement, html_content, flags=re.DOTALL)
        
        # Write back
        with open('about_me.html', 'w') as f:
            f.write(updated_html)
        
        print("✓ Updated about_me.html with generated publications")
        EOF
    
    - name: Commit changes
      run: |
        cd ${{ github.workspace }}
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        if git diff --quiet; then
          echo "No changes to commit"
        else
          git add about_me.html
          git commit -m "Auto-generate publications from BibTeX"
          git push
        fi
    
    - name: Clean up
      if: always()
      run: rm -f publications_temp.html
